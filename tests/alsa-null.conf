# ALSA configuration used by `make memcheck-game`.
#
# Sends the game's audio to ALSA's built-in "null" device (accepted,
# then discarded) instead of PipeWire. PipeWire's ALSA plugin keeps
# about 18 KB of its own memory after the device is closed, which
# Valgrind would report even though the game frees everything it
# owns. With the null device, any report is a real bug in our code.
pcm.!default { type null }
